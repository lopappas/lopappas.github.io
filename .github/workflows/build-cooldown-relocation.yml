name: Build cooldown relocation
on:
  pull_request:
    types: [ready_for_review, synchronize]
permissions:
  contents: write
jobs:
  package:
    if: github.event.pull_request.number == 4 && github.head_ref == 'codex/canvas-cooldowns-bottom-left-20261117-9a35bc' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wonderful-summit/source/package-lock.json
      - name: Prepare release
        working-directory: wonderful-summit/source
        run: |
          npm ci
          npm run version:small
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const version=JSON.parse(fs.readFileSync('package.json','utf8')).version;
          const p='src/versionHistory.ts';
          const entry={version,publishedAt:new Date().toISOString(),changes:['Moved cooldowns to the bottom-left of the spell canvas, with newest cooldowns first.']};
          fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace('export const VERSION_HISTORY=[','export const VERSION_HISTORY=[\n '+JSON.stringify(entry)+','));
          const status='../../PROJECT_STATUS.md';
          let s=fs.readFileSync(status,'utf8');
          s=s.replace(/Updated: [^\n]+/,'Updated: '+new Date().toISOString().slice(0,10));
          s=s.split('\n').filter(line=>!line.startsWith('- Draft source change: cooldowns')).join('\n');
          s=s.replace('Latest update (version 0.3.4; displayed 0.3.04):','Latest update (version '+version+'): Cooldowns now appear at the canvas bottom-left in their existing badge style. New starts enter on the left and earlier cooldowns move right; wrapping preserves visibility. Full automated tests and production build pass in GitHub Actions. Phone review remains outstanding.\n\nVersion 0.3.4:');
          fs.writeFileSync(status,s);
          JS
      - name: Test and build
        working-directory: wonderful-summit/source
        run: |
          npm test
          npm run build
      - name: Commit source and matching production build
        run: |
          cp -R wonderful-summit/source/dist-pages/. wonderful-summit/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md wonderful-summit/source/package.json wonderful-summit/source/package-lock.json wonderful-summit/source/src/versionHistory.ts wonderful-summit/index.html wonderful-summit/assets
          git diff --cached --check
          git commit -m "Build validated cooldown relocation release"
          git push origin HEAD:codex/canvas-cooldowns-bottom-left-20261117-9a35bc
